services:
  # ============================================
  # TRADING BOTS - Place orders on new markets
  # ============================================
  
  bot-btc-trade:
    build: .
    container_name: polymarket-btc-trade
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=btc
      - BOT_MODE=trade
    command: python main.py --market btc --mode trade
    volumes:
      - ./logs:/app/logs
    tty: true
    stdin_open: true

  bot-eth-trade:
    build: .
    container_name: polymarket-eth-trade
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=eth
      - BOT_MODE=trade
    command: python main.py --market eth --mode trade
    volumes:
      - ./logs:/app/logs
    tty: true
    stdin_open: true
    profiles:
      - eth  # Only start with: docker compose --profile eth up

  bot-sol-trade:
    build: .
    container_name: polymarket-sol-trade
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=sol
      - BOT_MODE=trade
    command: python main.py --market sol --mode trade
    volumes:
      - ./logs:/app/logs
    tty: true
    stdin_open: true
    profiles:
      - sol  # Only start with: docker compose --profile sol up

  # ============================================
  # MONITOR BOTS - Only collect price data
  # ============================================
  
  bot-btc-monitor:
    build: .
    container_name: polymarket-btc-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=btc
      - BOT_MODE=monitor
    command: python main.py --market btc --mode monitor
    volumes:
      - ./logs:/app/logs
    tty: true
    stdin_open: true
    profiles:
      - monitor  # Only start with: docker compose --profile monitor up

  bot-eth-monitor:
    build: .
    container_name: polymarket-eth-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=eth
      - BOT_MODE=monitor
    command: python main.py --market eth --mode monitor
    volumes:
      - ./logs:/app/logs
    tty: true
    stdin_open: true
    profiles:
      - monitor

  bot-sol-monitor:
    build: .
    container_name: polymarket-sol-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=sol
      - BOT_MODE=monitor
    command: python main.py --market sol --mode monitor
    volumes:
      - ./logs:/app/logs
    tty: true
    stdin_open: true
    profiles:
      - monitor

  # ============================================
  # WHALE COPY STRATEGY - Copy whale trades
  # Monitors all crypto markets automatically
  # ============================================
  
  bot-whale-copy:
    build: .
    container_name: polymarket-whale-copy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=btc
      - BOT_MODE=trade
      - BOT_STRATEGY=whale_copy
    command: python main.py --market btc --mode trade --strategy whale_copy
    tty: true
    stdin_open: true
    profiles:
      - whale  # Start with: docker compose --profile whale up

  # ============================================
  # EXPECTED VALUE STRATEGY - EV-based trading
  # ============================================
  
  bot-btc-ev:
    build: .
    container_name: polymarket-btc-ev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=btc
      - BOT_MODE=trade
      - BOT_STRATEGY=expected_value
    command: python main.py --market btc --mode trade --strategy expected_value
    volumes:
      - ./logs:/app/logs
    tty: true
    stdin_open: true
    profiles:
      - ev  # Start with: docker compose --profile ev up

  # ============================================
  # POSTCLOSE SNIPER - Directional bet on Chainlink delta
  # Buys winning side during post-close CLOB lag window
  # ============================================

  bot-btc-sniper:
    build: .
    container_name: polymarket-btc-sniper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MARKET=btc
      - BOT_MODE=trade
      - BOT_STRATEGY=postclose_sniper
    command: python main.py --market btc --mode trade --strategy postclose_sniper
    volumes:
      - ./logs:/app/logs
    tty: true
    stdin_open: true
    profiles:
      - sniper  # Start with: docker compose --profile sniper up

  # ============================================
  # FRONTRUN STRATEGY - Binance signal detection
  # Monitors Binance aggTrade for large trades
  # Records price evolution to CSV (no trading)
  # ============================================
  
  frontrun:
    build: .
    container_name: polymarket-frontrun
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - THRESHOLD_BTC=5.0
      - OUTPUT_DIR=/app/signals
    command: python scripts/frontrun_strategy.py
    volumes:
      - ./signals:/app/signals
    tty: true
    stdin_open: true
    profiles:
      - frontrun  # Start with: docker compose --profile frontrun up

 